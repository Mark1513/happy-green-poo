# Exemplo de configuração de segredos (SEM valores reais).
#
# Uso local: copie para .streamlit/secrets.toml (ignorado pelo Git) e preencha.
# Hospedagem: cole o conteúdo preenchido em Streamlit Community Cloud >
#             app > Settings > Secrets.
#
# Os valores vêm do Supabase: botão "Connect" > "Session pooler".
# O host do pooler NÃO pode ser deduzido da região; copie-o do painel.

[banco]
host = "aws-N-REGIAO.pooler.supabase.com"   # Session pooler (IPv4)
port = 5432                                 # 5432 = modo sessão
dbname = "postgres"
user = "happy_green_app.REF_DO_PROJETO"     # papel.ref-do-projeto (ver sql/002)
password = "SENHA_DO_USUARIO_happy_green_app"
schema = "happy_green"
sslmode = "require"                         # conexão sempre criptografada

# Somente para os testes de integração (pytest -m integracao).
# Usa um schema separado, para não mexer nos dados da demonstração.
# NÃO coloque esta seção nos Secrets da hospedagem.
[banco_teste]
host = "aws-N-REGIAO.pooler.supabase.com"
port = 5432
dbname = "postgres"
user = "happy_green_app.REF_DO_PROJETO"
password = "SENHA_DO_USUARIO_happy_green_app"
schema = "happy_green_teste"
sslmode = "require"
